<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Smarters Pro V1.1</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HLS.js para reproducción m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Vista Login -->
    <div id="viewLogin" class="fixed inset-0 bg-slate-950 z-50 flex flex-col items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl w-full max-w-md space-y-6 shadow-2xl">
            <div class="text-center space-y-2">
                <h1 class="text-2xl font-bold tracking-wide">IPTV <span class="text-cyan-500">SMARTERS PRO</span></h1>
                <p class="text-xs text-slate-400">Introduce tus credenciales autorizadas</p>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="text-xs text-slate-400 block mb-1">Usuario</label>
                    <input type="text" id="loginUser" placeholder="Ingrese Usuario" class="w-full bg-slate-950 border border-slate-800 px-4 py-2.5 rounded-xl text-sm focus:outline-none focus:border-cyan-500">
                </div>
                <div>
                    <label class="text-xs text-slate-400 block mb-1">Contraseña</label>
                    <input type="password" id="loginPass" placeholder="Ingrese Contraseña" class="w-full bg-slate-950 border border-slate-800 px-4 py-2.5 rounded-xl text-sm focus:outline-none focus:border-cyan-500">
                </div>
                <button onclick="handleLogin()" class="w-full bg-cyan-600 hover:bg-cyan-500 py-3 rounded-xl text-sm font-semibold transition shadow-lg shadow-cyan-600/30">
                    Iniciar Sesión
                </button>
            </div>
        </div>
    </div>

    <!-- Header Principal -->
    <header id="appHeader" class="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center hidden">
        <div class="flex items-center gap-3">
            <button id="btnHome" onclick="returnToDashboard()" class="hidden bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-xs transition flex items-center gap-2">
                <i class="fa-solid fa-house"></i> Menú
            </button>
            <span id="headerUserInfo" class="text-xs text-slate-300 font-medium">Usuario: --</span>
        </div>
        <div class="flex items-center gap-4">
            <span id="headerExp" class="text-xs text-cyan-400">Vence: --</span>
            <button onclick="logout()" class="bg-red-600/20 text-red-400 hover:bg-red-600 hover:text-white px-3 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5">
                <i class="fa-solid fa-power-off"></i> Salir
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main id="appMain" class="flex-1 flex flex-col overflow-hidden hidden">
        
        <!-- Dashboard Principal (Menú Estilo Smarters) -->
        <div id="viewDashboard" class="flex-1 flex flex-col items-center justify-center p-6 gap-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 w-full max-w-5xl">
                <div onclick="openSection('live')" class="bg-gradient-to-br from-cyan-600 to-blue-700 p-8 rounded-2xl cursor-pointer hover:scale-105 transition shadow-xl flex flex-col items-center text-center gap-3">
                    <i class="fa-solid fa-tv text-4xl text-white"></i>
                    <h2 class="text-lg font-bold text-white">TV EN DIRECTO</h2>
                    <p class="text-xs text-cyan-100">Canales en directo</p>
                </div>
                <div onclick="openSection('movies')" class="bg-gradient-to-br from-rose-600 to-red-700 p-8 rounded-2xl cursor-pointer hover:scale-105 transition shadow-xl flex flex-col items-center text-center gap-3">
                    <i class="fa-solid fa-film text-4xl text-white"></i>
                    <h2 class="text-lg font-bold text-white">CINE</h2>
                    <p class="text-xs text-rose-100">Cine y VOD</p>
                </div>
                <div onclick="openSection('series')" class="bg-gradient-to-br from-purple-600 to-indigo-700 p-8 rounded-2xl cursor-pointer hover:scale-105 transition shadow-xl flex flex-col items-center text-center gap-3">
                    <i class="fa-solid fa-clapperboard text-4xl text-white"></i>
                    <h2 class="text-lg font-bold text-white">SERIES</h2>
                    <p class="text-xs text-purple-100">Temporadas y capítulos</p>
                </div>
            </div>
        </div>

        <!-- Vista de Contenido y Reproductor -->
        <div id="viewContent" class="flex-1 flex flex-col lg:flex-row overflow-hidden hidden">
            <!-- Sección Video -->
            <section class="flex-1 bg-black flex flex-col justify-center items-center relative min-h-[300px]">
                <video id="videoPlayer" controls autoplay class="w-full h-full max-h-[75vh] object-contain"></video>
                
                <!-- Botones de Control Manual (Play, Pause, Stop) -->
                <div class="absolute top-4 left-4 flex gap-2 z-20">
                    <button onclick="manualPlay()" class="bg-green-600/80 hover:bg-green-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold backdrop-blur transition shadow"><i class="fa-solid fa-play"></i> Play</button>
                    <button onclick="manualPause()" class="bg-yellow-600/80 hover:bg-yellow-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold backdrop-blur transition shadow"><i class="fa-solid fa-pause"></i> Pause</button>
                    <button onclick="stopMedia()" class="bg-red-600/80 hover:bg-red-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold backdrop-blur transition shadow"><i class="fa-solid fa-stop"></i> Stop</button>
                </div>

                <div id="currentChannelInfo" class="absolute bottom-4 left-4 bg-slate-900/90 backdrop-blur px-4 py-2 rounded-lg border border-slate-700 text-sm hidden z-20">
                    <span class="text-cyan-400 font-semibold" id="playingName">Selecciona un elemento</span>
                </div>
            </section>

            <!-- Sidebar / Listas -->
            <aside class="w-full lg:w-96 bg-slate-900 border-l border-slate-800 flex flex-col h-[50vh] lg:h-auto">
                <div class="p-4 border-b border-slate-800 space-y-3">
                    <h3 id="sidebarTitle" class="text-sm font-bold text-cyan-400 uppercase tracking-wide">Categorías</h3>
                    <input type="text" id="searchMedia" placeholder="Buscar..." oninput="filterMedia()"
                        class="w-full bg-slate-950 border border-slate-700 px-3 py-2 rounded-lg text-xs focus:outline-none focus:border-cyan-500">
                </div>
                <div id="categoryList" class="p-2 space-y-1 border-b border-slate-800 max-h-48 overflow-y-auto"></div>
                <div id="mediaList" class="flex-1 overflow-y-auto p-2 space-y-1"></div>
            </aside>
        </div>
    </main>

    <!-- Scripts de la aplicación -->
    <script src="auth.js"></script>
    <script src="player.js"></script>
</body>
</html>
